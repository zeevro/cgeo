name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  pre-commit:
    name: Run pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run pre-commit
        uses: j178/prek-action@v2

  test:
    name: Test ${{ matrix.kind }} on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.13t', '3.14', '3.14t']
        kind: [pure-python, native]
        exclude: [{ kind: pure-python, python: 3.13t }, { kind: pure-python, python: 3.14t }]
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false
          python-version: ${{ matrix.python }}

      - name: Remove C extension from pyproject.toml
        run: uvx --from toml-cli toml unset --toml-path pyproject.toml tool.setuptools.ext-modules
        if: matrix.kind == 'pure-python'

      - name: Test
        run: uv run test.py -v
        env:
          PYTHONWARNINGS: ${{ matrix.kind == 'native' && 'error:Could not import cgeo C extension' || '' }}
