name: Release

on:
  workflow_dispatch:

jobs:
  package-version:
    name: Check package version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.package-version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-tags: true
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false

      - name: Get tag name from package version
        id: package-version
        run: |
          tag=v$(uv version --short)
          if [[ -n $(git tag -l "$tag") ]]; then
            echo "::error::Tag $tag already exists!"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: package-version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false

      - name: Build sdist
        run: uv build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sdist
          path: dist/

  pure-wheel:
    name: Build pure-python wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: package-version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false

      - name: Remove C extension from pyproject.toml
        run: uvx --from toml-cli toml unset --toml-path pyproject.toml tool.setuptools.ext-modules

      - name: Build wheel
        run: uv build --wheel

      - name: Test wheel
        run: uvx --no-index -f dist --with zeevro-cgeo python test.py -v

      - name: Upload wheel artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pure-wheel
          path: dist/

  linux-wheels:
    name: Build wheels on Ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: package-version
    strategy:
      matrix:
        plat: [manylinux, musllinux]
        arch:
          - {cibw: x86_64}
          - {cibw: i686}
          - {cibw: aarch64, qemu: arm64}
          - {cibw: armv7l, qemu: arm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          platforms: ${{ matrix.arch.qemu }}
        if: matrix.arch.qemu

      - name: Build wheels
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e  # v4.3.5
        env:
          CIBW_ARCHS: all
          CIBW_BUILD: cp*-${{ matrix.plat }}_${{ matrix.arch.cibw }}
          CIBW_ENABLE: cpython-freethreading
          CIBW_BUILD_FRONTEND: build[uv]
          CIBW_ENVIRONMENT: AUDITWHEEL_PLAT=

      - name: Upload wheels artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cibw-wheels-${{ matrix.plat }}-${{ matrix.arch.cibw }}-${{ strategy.job-index }}
          path: wheelhouse/

  windows-wheels:
    name: Build wheels on Windows
    runs-on: windows-latest
    permissions:
      contents: read
    needs: package-version
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.13t', '3.14', '3.14t', '3.15', '3.15t']
        arch: [x86_64, x86]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: cpython-${{ matrix.python }}-windows-${{ matrix.arch }}
          enable-cache: false

      - name: Build wheel
        run: uv build --wheel

      - name: Test wheel
        run: uvx --no-index -f dist --with zeevro-cgeo python test.py -v
        env:
          PYTHONWARNINGS: error:Could not import cgeo C extension

      - name: Upload wheels artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cibw-wheels-windows-${{ matrix.python }}-${{ matrix.arch }}-${{ strategy.job-index }}
          path: dist/

  macos-wheels:
    name: Build wheels on MacOS
    runs-on: macos-latest
    permissions:
      contents: read
    needs: package-version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false

      - name: Build wheels
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e  # v4.3.5
        env:
          CIBW_BUILD: cp*
          CIBW_ENABLE: cpython-freethreading
          CIBW_ARCHS: all
          CIBW_BUILD_FRONTEND: build[uv]
          CIBW_TEST_SKIP: '*arm64'

      - name: Upload wheels artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cibw-wheels-macos
          path: wheelhouse/

  release:
    name: Release
    needs: [package-version, sdist, pure-wheel, linux-wheels, windows-wheels, macos-wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        run: gh release create --target ${{ github.sha }} --generate-notes "$TAG" ./dist/*
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.package-version.outputs.tag }}

  publish:
    name: Publish
    needs: [sdist, pure-wheel, linux-wheels, windows-wheels, macos-wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/zeevro-cgeo
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false

      - name: Publish to PyPI
        run: uv publish
